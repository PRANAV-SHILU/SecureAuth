<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LookSphere</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://looksphere.vercel.app/" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="LookSphere is a next-gen social media platform by Pranav Shilu. Share photos, videos, connect with creators, and explore trending content. LookSphere by Pranav Shilu."
    />
    <meta name="author" content="Pranav Shilu" />
    <meta name="keywords" content="LookSphere, Pranav Shilu, LookSphere Vercel, Vercel, LookSphere by Pranav Shilu, Look Sphere, social media platform, video sharing, photo sharing, MERN stack, full-stack project" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://looksphere.vercel.app/" />
    <meta property="og:title" content="LookSphere" />
    <meta property="og:description" content="LookSphere is a next-gen social media platform by Pranav Shilu. Share photos, videos, connect with creators, and explore trending content. LookSphere by Pranav Shilu." />
    <meta property="og:image" content="https://looksphere.vercel.app/og-image.jpg" />
    <meta property="og:site_name" content="LookSphere by Pranav Shilu" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://looksphere.vercel.app/" />
    <meta property="twitter:title" content="LookSphere" />
    <meta property="twitter:description" content="LookSphere is a next-gen social media platform by Pranav Shilu. Share photos, videos, connect with creators, and explore trending content. LookSphere by Pranav Shilu." />
    <meta property="twitter:image" content="https://looksphere.vercel.app/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "LookSphere",
            "alternateName": ["Look Sphere", "LookSphere Vercel", "LookSphere by Pranav Shilu"],
            "url": "https://looksphere.vercel.app/",
            "description": "LookSphere is a next-gen social media platform by Pranav Shilu. Share photos, videos, connect with creators, and explore trending content.",
            "creator": {
              "@type": "Person",
              "name": "Pranav Shilu",
              "url": "https://www.linkedin.com/in/pranavshilu/",
              "sameAs": [
                "https://github.com/PRANAV-SHILU",
                "https://www.linkedin.com/in/pranavshilu/"
              ],
              "jobTitle": "Full-Stack Developer"
            }
          },
          {
            "@type": "WebApplication",
            "name": "LookSphere",
            "url": "https://looksphere.vercel.app/",
            "applicationCategory": "SocialNetworkingApplication",
            "operatingSystem": "Web",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Person",
              "name": "Pranav Shilu"
            }
          }
        ]
      }
    </script>

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Cloudinary Media Preconnect -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme flash prevention.
      Runs synchronously before React mounts so the correct .dark class is on
      <html> before the first paint — eliminates flash of wrong theme.
      Default: dark mode (matches the original design).
    -->
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        if (stored === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
